name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by the release workflow on release-please PRs: PRs opened with
  # the built-in token don't trigger `pull_request` workflows, but dispatched
  # runs report their checks on the PR head commit (required for auto-merge).
  workflow_dispatch:

permissions:
  contents: read

env:
  VICTORIALOGS_VERSION: v1.54.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Benchmarks (smoke)
        run: go test -run XXX -bench . -benchtime 2000x -benchmem ./internal/...

  # Every LogsQL query produced by the translator tests is parsed by the real
  # VictoriaLogs parser, so syntax drift is caught early.
  logsql-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: VictoriaMetrics/VictoriaLogs
          ref: ${{ env.VICTORIALOGS_VERSION }}
          path: _victorialogs
      - uses: actions/setup-go@v7
        with:
          go-version-file: _victorialogs/go.mod
      - name: Build vlcheck against VictoriaLogs ${{ env.VICTORIALOGS_VERSION }}
        run: |
          mkdir -p _victorialogs/app/vlcheck
          sed '1d' tools/vlcheck/main.go > _victorialogs/app/vlcheck/main.go
          cd _victorialogs && CGO_ENABLED=0 go build -mod=vendor -o ../vlcheck ./app/vlcheck
      - name: Validate generated LogsQL
        run: |
          TRANSLATE_DUMP=$PWD/queries.tsv go test -count=1 ./internal/translate/
          ./vlcheck < queries.tsv

  e2e:
    runs-on: ubuntu-latest
    services:
      victorialogs:
        image: victoriametrics/victoria-logs:v1.54.0
        ports: ["9428:9428"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Ingest sample logs
        run: |
          until curl -sf http://localhost:9428/health; do sleep 1; done
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for i in $(seq 1 200); do
            lvl=info; [ $((i % 5)) -eq 0 ] && lvl=error
            printf '{"_time":"%s","_msg":"level=%s msg=\\"request %s\\" took=%sms","service.name":"svc-%s","k8s.pod.name":"pod-%s","level":"%s"}\n' \
              "$now" "$lvl" "$i" "$((i % 90))" "$((i % 3))" "$((i % 5))" "$lvl"
          done | curl -sf -H 'Content-Type: application/stream+json' --data-binary @- 'http://localhost:9428/insert/jsonline?_stream_fields=service.name,k8s.pod.name'
          sleep 3
      - name: Grafana / Logs Drilldown request set
        env:
          LOKI_VL_PROXY_E2E_URL: http://localhost:9428
        run: go test -count=1 -run E2E -v ./internal/proxy/

  # Static binaries, Linux only.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build linux/${{ matrix.arch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA::12}" \
            -o dist/linux_${{ matrix.arch }}/loki-vl-proxy ./cmd/loki-vl-proxy
          file dist/linux_${{ matrix.arch }}/loki-vl-proxy
      - uses: actions/upload-artifact@v7
        with:
          name: loki-vl-proxy-linux-${{ matrix.arch }}
          path: dist/linux_${{ matrix.arch }}/loki-vl-proxy
          if-no-files-found: error
          retention-days: 7

  # Multi-arch image assembled from the binaries above (no compilation in Docker).
  # Pushed to ghcr.io for pushes to main; pull requests and dispatched runs only build it.
  image:
    needs: [test, logsql-syntax, e2e, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: loki-vl-proxy-linux-*
          path: artifacts
      - name: Lay out binaries for the Dockerfile
        run: |
          for arch in amd64 arm64; do
            install -D -m 0755 artifacts/loki-vl-proxy-linux-$arch/loki-vl-proxy dist/linux_$arch/loki-vl-proxy
          done
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # release-please PRs for minor and patch versions merge themselves once
  # every check above is green (major versions and breaking changes wait for a
  # human). The built-in token's merge does not trigger push workflows, so the
  # Release workflow is dispatched explicitly to publish the release.
  release-automerge:
    needs: [test, logsql-syntax, e2e, build, image]
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-please--branches--main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Merge minor/patch release PR and publish
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number,headRefOid,body --jq '.[0] // empty')
          if [ -z "$pr" ]; then echo "no open release PR for $GITHUB_REF_NAME"; exit 0; fi
          number=$(jq -r .number <<<"$pr")
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$GITHUB_SHA" ]; then
            echo "release PR #$number moved past the tested commit; a new CI run will handle it"; exit 0
          fi
          if jq -r .body <<<"$pr" | grep -qi "breaking change"; then
            echo "release PR #$number contains breaking changes: manual review"; exit 0
          fi
          manifest() { gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$1" --jq .content | base64 -d | jq -r '.["."] // "0.0.0"'; }
          cur=$(manifest main); new=$(manifest "$GITHUB_SHA")
          if [ "${cur%%.*}" != "${new%%.*}" ]; then
            echo "major release $cur -> $new: manual review"; exit 0
          fi
          echo "auto-merging release PR #$number ($cur -> $new)"
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$GITHUB_SHA"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
